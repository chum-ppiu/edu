<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Background/Base -->
  <rect x="2" y="26" width="28" height="4" rx="1" fill="#4A5568"/>
  
  <!-- Main Building -->
  <rect x="5" y="12" width="22" height="14" fill="#E2E8F0"/>
  <rect x="5" y="12" width="22" height="14" fill="#EDF2F7" clip-path="polygon(0 0, 11 0, 11 14, 0 14)"/>
  
  <!-- Center Tower -->
  <rect x="11" y="6" width="10" height="10" fill="#CBD5E0"/>
  
  <!-- Roofs (Clock tower and Main) -->
  <polygon points="10,6 16,1 22,6" fill="#E53E3E"/>
  <polygon points="4,12 11,12 11,10 4,12" fill="#C53030"/>
  <polygon points="28,12 21,12 21,10 28,12" fill="#C53030"/>
  
  <!-- Clock -->
  <circle cx="16" cy="9" r="2" fill="#FFFFFF"/>
  <circle cx="16" cy="9" r="2" fill="none" stroke="#4A5568" stroke-width="0.5"/>
  <line x1="16" y1="9" x2="16" y2="8" stroke="#4A5568" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="16" y1="9" x2="17" y2="9" stroke="#4A5568" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Entrance / Door -->
  <path d="M13,26 V21 A3,3 0 0,1 19,21 V26 Z" fill="#4A5568"/>
  
  <!-- Windows -->
  <!-- Left Wing -->
  <rect x="7" y="15" width="2" height="3" rx="0.5" fill="#4A5568"/>
  <rect x="7" y="20" width="2" height="3" rx="0.5" fill="#4A5568"/>
  <!-- Right Wing -->
  <rect x="23" y="15" width="2" height="3" rx="0.5" fill="#4A5568"/>
  <rect x="23" y="20" width="2" height="3" rx="0.5" fill="#4A5568"/>
</svg>
